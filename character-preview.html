<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>معاينة الشخصية</title><style>html,body{width:100%;height:100%;overflow:hidden}body{margin:0;background:#e9e2d2;font-family:Tahoma;color:#26374d}#info{position:absolute;top:20px;right:20px;left:20px;pointer-events:none}h1{font-size:20px}#toggle{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);padding:14px 24px;background:#26374d;border:0;border-radius:10px;color:white}canvas{display:block}</style><script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script><div id="info"><h1>الشخصية الأولى</h1><p id="status" role="status">جاري تحميل الشخصية وحركة المشي…</p></div><button id="toggle" hidden>إيقاف المشي</button><script type="module">
import * as THREE from 'three';import{createCharacter}from './characters.js';import{OrbitControls}from 'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#e9e2d2');const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,100);camera.position.set(3,2.1,-4);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.95,0);controls.update();scene.add(new THREE.HemisphereLight(0xffffff,0x77736c,2));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(3,5,-3);scene.add(light);
const floor=new THREE.Mesh(new THREE.CircleGeometry(3,64),new THREE.MeshStandardMaterial({color:'#d9d2c4',roughness:.8}));floor.rotation.x=-Math.PI/2;floor.position.y=-.02;scene.add(floor);
let character,walking=true;const clock=new THREE.Clock();function render(){requestAnimationFrame(render);const dt=Math.min(clock.getDelta(),.05);character?.update(dt,walking?1.8:0);renderer.render(scene,camera)}render();
try{character=await createCharacter();scene.add(character.root);document.getElementById('status').textContent='تم تحميل الشخصية وحركة المشي. اسحب لتدوير المعاينة.';document.getElementById('toggle').hidden=false;}catch(e){document.getElementById('status').textContent='تعذر تحميل الشخصية: '+e.message;console.error(e)}
document.getElementById('toggle').onclick=()=>{walking=!walking;document.getElementById('toggle').textContent=walking?'إيقاف المشي':'تشغيل المشي'};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></html>
